<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WhatsApp Assistant</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0b0d12;
    --panel: #12151c;
    --border: #232833;
    --text: #e6e9ef;
    --muted: #8b93a3;
    --accent: #25d366;
    --user-bubble: #1f6feb22;
    --assistant-bubble: #171b24;
    --tool-bubble: #1a2a1f;
    --error-bubble: #3a1414;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0;
  }
  header .sub {
    color: var(--muted);
    font-size: 12px;
    margin-top: 2px;
  }
  select {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 13px;
  }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
  }
  .bubble {
    padding: 10px 14px;
    border-radius: 10px;
    max-width: 100%;
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.45;
    font-size: 14px;
  }
  .user { align-self: flex-end; background: var(--user-bubble); border: 1px solid #1f6feb55; }
  .assistant { align-self: flex-start; background: var(--assistant-bubble); border: 1px solid var(--border); }
  .tool { align-self: flex-start; background: var(--tool-bubble); border: 1px solid #2f6b3f55; font-size: 12.5px; color: var(--muted); font-family: ui-monospace, monospace; }
  .tool .name { color: #8fd19e; }
  .tool .result { display: block; margin-top: 6px; color: var(--text); white-space: pre-wrap; max-height: 220px; overflow-y: auto; }
  .error { align-self: center; background: var(--error-bubble); border: 1px solid #7a2424; color: #ffb4b4; font-size: 13px; }
  .status { align-self: flex-start; color: var(--muted); font-size: 12.5px; font-style: italic; }
  footer {
    border-top: 1px solid var(--border);
    background: var(--panel);
    padding: 14px 20px;
  }
  form {
    max-width: 820px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
  }
  textarea {
    flex: 1;
    resize: none;
    background: #0e1117;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    min-height: 42px;
    max-height: 160px;
  }
  button {
    background: var(--accent);
    color: #06210f;
    border: none;
    border-radius: 8px;
    padding: 0 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
  <header>
    <div>
      <h1>WhatsApp assistant</h1>
      <div class="sub">talks to your linked WhatsApp account over its MCP server, via an AG-UI protocol stream</div>
    </div>
    <select id="provider">
      <option value="openai">OpenAI</option>
      <option value="claude">Claude</option>
      <option value="deepseek">DeepSeek</option>
    </select>
  </header>

  <div id="log"></div>

  <footer>
    <form id="form">
      <textarea id="input" placeholder="Ask it to check messages, send one, or look someone up..." rows="1"></textarea>
      <button id="send" type="submit">Send</button>
    </form>
  </footer>

<script>
(() => {
  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const sendButton = document.getElementById("send");
  const providerSelect = document.getElementById("provider");

  const threadId = crypto.randomUUID();
  /** @type {{id: string, role: string, content: string}[]} */
  const messages = [];

  function bubble(className, text) {
    const el = document.createElement("div");
    el.className = "bubble " + className;
    el.textContent = text;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  function setBusy(busy) {
    sendButton.disabled = busy;
    input.disabled = busy;
  }

  async function send(text) {
    messages.push({ id: crypto.randomUUID(), role: "user", content: text });
    bubble("user", text);

    setBusy(true);
    const statusEl = bubble("status", "thinking…");

    const textBubbles = new Map(); // messageId -> { el, buffer }
    const toolBubbles = new Map(); // toolCallId -> { el, nameEl, resultEl }

    try {
      const res = await fetch("/agent", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          threadId,
          runId: crypto.randomUUID(),
          messages,
          forwardedProps: { provider: providerSelect.value },
        }),
      });

      if (!res.ok || !res.body) {
        throw new Error(`Request failed: ${res.status} ${res.statusText}`);
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        let sep;
        while ((sep = buffer.indexOf("\n\n")) !== -1) {
          const frame = buffer.slice(0, sep);
          buffer = buffer.slice(sep + 2);
          const line = frame.split("\n").find((l) => l.startsWith("data:"));
          if (!line) continue;

          const event = JSON.parse(line.slice(5).trim());
          handleEvent(event);
        }
      }
    } catch (err) {
      bubble("error", String(err));
    } finally {
      statusEl.remove();
      setBusy(false);
    }

    function handleEvent(event) {
      switch (event.type) {
        case "TEXT_MESSAGE_START": {
          const el = bubble("assistant", "");
          textBubbles.set(event.messageId, { el, buffer: "" });
          break;
        }
        case "TEXT_MESSAGE_CONTENT": {
          const entry = textBubbles.get(event.messageId);
          if (entry) {
            entry.buffer += event.delta;
            entry.el.textContent = entry.buffer;
            log.scrollTop = log.scrollHeight;
          }
          break;
        }
        case "TEXT_MESSAGE_END": {
          const entry = textBubbles.get(event.messageId);
          if (entry) {
            messages.push({ id: event.messageId, role: "assistant", content: entry.buffer });
          }
          break;
        }
        case "TOOL_CALL_START": {
          const el = document.createElement("div");
          el.className = "bubble tool";
          const nameEl = document.createElement("span");
          nameEl.className = "name";
          nameEl.textContent = "🔧 " + event.toolCallName;
          el.appendChild(nameEl);
          const resultEl = document.createElement("span");
          resultEl.className = "result";
          resultEl.textContent = "running…";
          el.appendChild(resultEl);
          log.appendChild(el);
          log.scrollTop = log.scrollHeight;
          toolBubbles.set(event.toolCallId, { el, nameEl, resultEl });
          break;
        }
        case "TOOL_CALL_RESULT": {
          const entry = toolBubbles.get(event.toolCallId);
          if (entry) {
            const text = typeof event.content === "string" ? event.content : JSON.stringify(event.content);
            entry.resultEl.textContent = text.length > 2000 ? text.slice(0, 2000) + "…" : text;
            log.scrollTop = log.scrollHeight;
          }
          break;
        }
        case "RUN_ERROR": {
          bubble("error", event.message);
          break;
        }
        default:
          break;
      }
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    input.style.height = "auto";
    send(text);
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 160) + "px";
  });
})();
</script>
</body>
</html>
